          it.filled_circle(60, 184, 18, (fl && fop == 41) ? accent : Color(0x333333));
          it.printf(60, 146, id(font_value), Color::WHITE, TextAlign::CENTER, "+");
          it.printf(60, 184, id(font_value), Color::WHITE, TextAlign::CENTER, "-");
          // minut + / -
          it.filled_circle(180, 146, 18, (fl && fop == 42) ? accent : Color(0x333333));
          it.filled_circle(180, 184, 18, (fl && fop == 43) ? accent : Color(0x333333));
          it.printf(180, 146, id(font_value), Color::WHITE, TextAlign::CENTER, "+");
          it.printf(180, 184, id(font_value), Color::WHITE, TextAlign::CENTER, "-");
          // pornit / oprit
          it.filled_circle(120, 166, 28, aon ? accent_bg : grey_bg);
          it.circle(120, 166, 29, aon ? accent : Color(0x555555));
          if (fl && fop == 44) {
            it.circle(120, 166, 31, Color::WHITE);
            it.circle(120, 166, 32, Color::WHITE);
          }
          it.printf(120, 166, id(font_art), aon ? accent : Color(0x999999), TextAlign::CENTER, "%s", aon ? "ON" : "OFF");
        } else if (cardp || morep) {
          // ---------- CARDURI: pagina de start (lumina, clima, muzica, alarma + volum) sau "Mai multe" ----------
          auto rrect = [&](int x, int y, int w, int h, int r, Color c) {
            it.filled_rectangle(x + r, y, w - 2 * r, h, c);
            it.filled_rectangle(x, y + r, w, h - 2 * r, c);
            it.filled_circle(x + r, y + r, r, c);
            it.filled_circle(x + w - r - 1, y + r, r, c);
            it.filled_circle(x + r, y + h - r - 1, r, c);
            it.filled_circle(x + w - r - 1, y + h - r - 1, r, c);
          };
          Color card_bg = Color(0x17171C);
          Color card_tx = Color(0x9A9AA3);
          if (cardp) it.printf(120, 24, id(font_label), card_tx, TextAlign::CENTER, "${room_label}");
          else it.printf(120, 24, id(font_label), card_tx, TextAlign::CENTER, "Mai multe");
          const int cx0[4] = {40, 124, 40, 124};
          const int cy0[4] = {42, 42, 110, 110};
          for (int c = 0; c < 4; c++) {
            int sl = -1;
            bool alarm_cell = false;
            if (cardp) {
              if (c == 0) sl = m1;
              else if (c == 1) sl = m2;
              else if (c == 2) sl = m3;
              else alarm_cell = true;
            } else {
              int j = (s - pmore) * 4 + c;
              if (j < nr) sl = rest[j];
              else continue;
            }
            rrect(cx0[c], cy0[c], 76, 60, 12, card_bg);
            int mx = cx0[c] + 38;
            if (alarm_cell) {
              bool aon = id(alarm_on)->state;
              snprintf(buf, sizeof(buf), "%02d:%02d", (int) id(alarm_h)->state, (int) id(alarm_min)->state);
              it.printf(mx, cy0[c] + 22, id(font_art), aon ? Color(0x4ADE80) : Color(0x777777), TextAlign::CENTER, "%s", buf);
              it.printf(mx, cy0[c] + 46, id(font_label), card_tx, TextAlign::CENTER, "Alarma");
            } else if (sl >= 0) {
              char vb[24];
              Color vcol = Color(0x777777);
              bool small = false;
              slot_val(sl, vb, sizeof(vb), vcol, small);
              it.printf(mx, cy0[c] + 22, small ? id(font_label) : id(font_art), vcol, TextAlign::CENTER, "%s", vb);
              it.printf(mx, cy0[c] + 46, id(font_label), card_tx, TextAlign::CENTER, "%s", utf8_take(*a_nm[sl], 0, 10).c_str());
            } else {
              it.printf(mx, cy0[c] + 22, id(font_art), Color(0x555555), TextAlign::CENTER, "--");
            }
          }
          if (cardp) {
            float mvol = (m3 >= 0) ? a_vo[m3]->state : NAN;
            it.filled_rectangle(64, 184, 112, 8, Color(0x2A2A2A));
            it.filled_circle(64, 188, 4, Color(0x2A2A2A));
            it.filled_circle(175, 188, 4, Color(0x2A2A2A));
            if (!std::isnan(mvol) && mvol > 0.0f) {
              int fw = (int) (112.0f * mvol);
              it.filled_rectangle(64, 184, fw, 8, accent);
              it.filled_circle(64, 188, 4, accent);
              it.filled_circle(64 + fw, 188, 4, accent);
            }
          }
        } else if (diagp) {
          // ---------- PAGINA DIAGNOSTIC ----------
          id(diag_vis) = true;
          it.printf(120, 30, id(font_label), accent, TextAlign::CENTER, "Diagnostic");
          float rs = id(wifi_sig)->state;
          bool hok = id(api_up);
          auto t1 = id(ha_time)->now();
          auto t2 = id(sntp_time)->now();
          const char *tsrc = t1.is_valid() ? "HA" : (t2.is_valid() ? "internet" : "fara ora");
          uint32_t age = (millis() - id(last_push_ms)) / 1000;
          uint32_t up = millis() / 1000;
          const char *lab[6] = {"Wi-Fi", "Home Assistant", "Stari", "Ora", "Baterie", "Uptime"};
          char val[6][20];
          Color vc[6];
          if (std::isnan(rs)) snprintf(val[0], 20, "--");
          else snprintf(val[0], 20, "%.0f dBm", rs);
          vc[0] = std::isnan(rs) ? Color(0x777777) : (rs > -70 ? Color(0x4ADE80) : (rs > -80 ? Color(0xFFB300) : Color(0xE53935)));
          snprintf(val[1], 20, "%s", hok ? "conectat" : "deconectat");
          vc[1] = hok ? Color(0x4ADE80) : Color(0xE53935);
          if (!hok || id(last_push_ms) == 0) snprintf(val[2], 20, "fara");
          else snprintf(val[2], 20, "acum %u s", (unsigned) age);
          vc[2] = (hok && id(last_push_ms) != 0 && age < 15) ? Color(0x4ADE80) : Color(0xFFB300);
          snprintf(val[3], 20, "%s", tsrc);
          vc[3] = t1.is_valid() ? Color(0x4ADE80) : (t2.is_valid() ? Color(0xFFB300) : Color(0xE53935));
          if (std::isnan(bat)) snprintf(val[4], 20, "--");
          else snprintf(val[4], 20, "%d%%", (int) roundf(bat));
          vc[4] = (std::isnan(bat) || bat >= 25) ? Color(0xCFCFD6) : Color(0xE53935);
          snprintf(val[5], 20, "%ud %uh", (unsigned) (up / 86400), (unsigned) ((up % 86400) / 3600));
          vc[5] = Color(0xCFCFD6);
          for (int i = 0; i < 6; i++) {
            int yy = 62 + i * 24;
            it.printf(44, yy, id(font_label), Color(0x9A9AA3), TextAlign::CENTER_LEFT, "%s", lab[i]);
            it.printf(196, yy, id(font_label), vc[i], TextAlign::CENTER_RIGHT, "%s", val[i]);
            it.line(44, yy + 11, 196, yy + 11, Color(0x222222));
          }
          it.printf(120, 212, id(font_label), Color(0x666666), TextAlign::CENTER, "ESPHome %s", ESPHOME_VERSION);
        }
        // puncte de pagina: albe = ok, rosii = Home Assistant deconectat, galbene = nu vin stari
        Color dot_on = Color::WHITE;
        Color dot_off = Color(0x555555);
        if (!id(api_up)) {
          dot_on = Color(0xE53935);
          dot_off = Color(0x6A2626);
        } else if ((uint32_t) (millis() - id(last_push_ms)) > 15000) {
          dot_on = Color(0xFFB300);
          dot_off = Color(0x6A5200);
        }
        for (int p = 0; p < np2 && ds < 0; p++) {
          int dxp = 120 + (p * 10) - ((np2 - 1) * 5);
          it.filled_circle(dxp, 226, (p == s) ? 3 : 2, (p == s) ? dot_on : dot_off);
        }
        // avertisment baterie slaba
        if (ds < 0 && !std::isnan(bat) && bat < 25) {
          snprintf(buf, sizeof(buf), "%d%%", (int) roundf(bat));
          it.printf(120, 211, id(font_label), Color(0xE53935), TextAlign::CENTER, "%s", buf);
        }
      } else {
        // ---------- STANDBY: ceas analogic sau digital ----------
        static const char *DAYS[7] = {"Duminica", "Luni", "Marti", "Miercuri", "Joi", "Vineri", "Sambata"};
        static const char *DAYS3[7] = {"Dum", "Lun", "Mar", "Mie", "Joi", "Vin", "Sam"};
        static const char *MONS[12] = {"Ian", "Feb", "Mar", "Apr", "Mai", "Iun", "Iul", "Aug", "Sep", "Oct", "Noi", "Dec"};
        auto now = id(ha_time)->now(); if (!now.is_valid()) now = id(sntp_time)->now();
        if (id(night_now)) {
          // ----- NOAPTE: ceas digital foarte slab, ca sa nu lumineze camera -----
          if (now.is_valid()) snprintf(buf, sizeof(buf), "%02d:%02d", now.hour, now.minute);
          else snprintf(buf, sizeof(buf), "--:--");
          it.printf(120, 110, id(font_clock), Color(0x5A5A62), TextAlign::CENTER, "%s", buf);
          it.printf(120, 148, id(font_label), Color(0x5A5A62), TextAlign::CENTER, "mod noapte");
          if (id(alarm_on)->state) {
            snprintf(buf, sizeof(buf), "Alarma %02d:%02d", (int) id(alarm_h)->state, (int) id(alarm_min)->state);
            it.printf(120, 176, id(font_label), Color(0x45454C), TextAlign::CENTER, "%s", buf);
          }
        } else if (id(sb_style) == 0) {
          // ----- ANALOG: cadran cu ace, temperatura, vreme si data -----
          int hh = 12, mm = 0, ss = 0;
          if (now.is_valid()) {
            hh = now.hour;
            mm = now.minute;
            ss = now.second;
          }
          const float D2R = 0.0174533f;
          // ac: unghi in grade de la ora 12, in sensul acelor de ceasornic
          auto hand = [&](float ang_deg, int len, int w, Color c) {
            float a = ang_deg * D2R;
            float sx = sinf(a);
            float cy_ = cosf(a);
            int stp = (w > 1) ? 2 : 1;
            for (int d = 0; d <= len; d += stp) {
              it.filled_circle(120 + (int) (d * sx), 120 - (int) (d * cy_), w, c);
            }
          };
          // repere: 60 de minute, cele de la 5 minute mai lungi si colorate; la 12/3/6/9 stau cifrele
          for (int k = 0; k < 60; k++) {
            if (k % 15 == 0) continue;
            float a = k * 6.0f * D2R;
            bool big = (k % 5 == 0);
            int r1 = big ? 98 : 106;
            int x1 = 120 + (int) (r1 * sinf(a));
            int y1 = 120 - (int) (r1 * cosf(a));
            int x2 = 120 + (int) (114.0f * sinf(a));
            int y2 = 120 - (int) (114.0f * cosf(a));
            it.line(x1, y1, x2, y2, big ? accent : Color(0x777777));
          }
          it.printf(120, 32, id(font_num), Color::WHITE, TextAlign::CENTER, "12");
          it.printf(208, 120, id(font_num), Color::WHITE, TextAlign::CENTER, "3");
          it.printf(120, 208, id(font_num), Color::WHITE, TextAlign::CENTER, "6");
          it.printf(32, 120, id(font_num), Color::WHITE, TextAlign::CENTER, "9");
          // temperatura de afara
          float wt = id(wx_temp)->state;
          if (std::isnan(wt)) snprintf(buf, sizeof(buf), "--");
          else snprintf(buf, sizeof(buf), "%.0f", wt);
          it.printf(78, 92, id(font_value), Color::WHITE, TextAlign::CENTER, "%s", buf);
          it.printf(98, 84, id(font_label), Color::WHITE, TextAlign::CENTER_LEFT, "°C");
          // pictograma de vreme dupa starea entitatii de vreme
          std::string ws = id(wx_state)->state;
          const char *wi = "";
          if (ws == "sunny") wi = "\U000F0599";
          else if (ws == "clear-night") wi = "\U000F0594";
          else if (ws == "partlycloudy") wi = "\U000F0595";
          else if (ws == "cloudy") wi = "\U000F0590";
          else if (ws == "rainy") wi = "\U000F0597";
          else if (ws == "pouring") wi = "\U000F0596";
          else if (ws == "snowy") wi = "\U000F0598";
          else if (ws == "snowy-rainy") wi = "\U000F067F";
          else if (ws == "lightning") wi = "\U000F0593";
          else if (ws == "lightning-rainy") wi = "\U000F067E";
          else if (ws == "fog") wi = "\U000F0591";
          else if (ws == "hail") wi = "\U000F0592";
          else if (ws == "windy" || ws == "windy-variant") wi = "\U000F059D";
          else if (ws == "exceptional") wi = "\U000F0590";
          if (wi[0] != '\0') it.printf(162, 92, id(font_wx), accent, TextAlign::CENTER, "%s", wi);
          // data, sub centru
          if (now.is_valid()) {
            it.printf(120, 140, id(font_art), Color::WHITE, TextAlign::CENTER, "%s", DAYS3[now.day_of_week - 1]);
            snprintf(buf, sizeof(buf), "%02d %s", now.day_of_month, MONS[now.month - 1]);
            it.printf(120, 162, id(font_art), Color::WHITE, TextAlign::CENTER, "%s", buf);
          }
          // jos: baterie slaba (rosu) sau ora alarmei, daca e pornita
          if (!std::isnan(bat) && bat < 20) {
            snprintf(buf, sizeof(buf), "%d%%", (int) roundf(bat));
            it.printf(120, 182, id(font_label), Color(0xE53935), TextAlign::CENTER, "%s", buf);
          } else if (id(alarm_on)->state) {
            snprintf(buf, sizeof(buf), "Alarma %02d:%02d", (int) id(alarm_h)->state, (int) id(alarm_min)->state);
            it.printf(120, 182, id(font_label), Color(0x999999), TextAlign::CENTER, "%s", buf);
          }
          // ace: ora, minutul, apoi secundarul (rosu) deasupra
          float ha_deg = ((hh % 12) + mm / 60.0f) * 30.0f;
          float ma_deg = (mm + ss / 60.0f) * 6.0f;
          float sa_deg = ss * 6.0f;
          hand(ha_deg, 52, 3, Color::WHITE);
          hand(ma_deg, 84, 2, Color::WHITE);
          hand(sa_deg, 94, 1, Color(0xFF3D3D));
          hand(sa_deg + 180.0f, 22, 1, Color(0xFF3D3D));
          it.filled_circle(120, 120, 5, Color(0xFF3D3D));
        } else {
          // ----- DIGITAL: ora mare, data, bateria -----
          if (now.is_valid()) snprintf(buf, sizeof(buf), "%02d:%02d", now.hour, now.minute);
          else snprintf(buf, sizeof(buf), "--:--");
          it.printf(120, 98, id(font_clock), Color::WHITE, TextAlign::CENTER, "%s", buf);
          if (now.is_valid()) {
            char dbuf[40];
            snprintf(dbuf, sizeof(dbuf), "%s, %d %s", DAYS[now.day_of_week - 1], now.day_of_month, MONS[now.month - 1]);
            it.printf(120, 148, id(font_date), accent, TextAlign::CENTER, "%s", dbuf);
          }
          if (!std::isnan(bat)) {
            int bx = 85;
            int by = 184;
            it.rectangle(bx, by, 28, 14, Color(0xAAAAAA));
            it.filled_rectangle(bx + 28, by + 4, 3, 6, Color(0xAAAAAA));
            int fillw = (int) (24.0f * bat / 100.0f);
            it.filled_rectangle(bx + 2, by + 2, fillw, 10, bat < 20 ? Color(0xE53935) : Color(0x66BB6A));
            snprintf(buf, sizeof(buf), "%d%%", (int) roundf(bat));
            it.printf(bx + 38, by + 7, id(font_label), Color(0xBBBBBB), TextAlign::CENTER_LEFT, "%s", buf);
          }
        }
      }
