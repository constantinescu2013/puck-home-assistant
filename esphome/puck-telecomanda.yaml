# ================= TIMERE =================
interval:
  # animatia Jarvis cat timp asistentul asculta, se gandeste sau raspunde, si pulsul ecranului de alarma
  - interval: 120ms
    then:
      - if:
          condition:
            lambda: 'return (id(va_phase) >= 1 && id(va_phase) <= 3) || id(alarm_ringing);'
          then:
            - lambda: id(va_frame) = id(va_frame) + 1;
            - component.update: lcd
  # timpul melodiei curge cat timp se reda muzica si pagina de media e deschisa
  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              if (id(view) != 0 || id(va_phase) > 0) return false;
              int s = id(det_slot);
              if (s < 0 || s > 7) return false;
              int *a_kd[8] = {&id(kd_1), &id(kd_2), &id(kd_3), &id(kd_4), &id(kd_5), &id(kd_6), &id(kd_7), &id(kd_8)};
              text_sensor::TextSensor *a_st[8] = {id(st_1), id(st_2), id(st_3), id(st_4), id(st_5), id(st_6), id(st_7), id(st_8)};
              return *a_kd[s] == 3 && a_st[s]->state == "playing";
          then:
            - component.update: lcd
  # ceas analogic in standby: secundarul se misca, deci redeseneaza o data pe secunda
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(view) == 2 && id(sb_style) == 0 && !id(alarm_ringing) && id(va_phase) == 0;'
          then:
            - component.update: lcd
  # sleep timer: numara secundele; la zero opreste muzica
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(sleep_left) > 0;'
          then:
            - lambda: |-
                id(sleep_left) = id(sleep_left) - 1;
                int m = (id(sleep_left) + 59) / 60;
                if (m != id(sleep_pub)) {
                  id(sleep_pub) = m;
                  id(sleep_rem)->publish_state(m);
                }
            - if:
                condition:
                  lambda: 'return id(num_fade)->state > 0 && id(sleep_left) > 0 && id(sleep_left) == (int) id(num_fade)->state;'
                then:
                  - script.execute: sleep_fade
            - if:
                condition:
                  lambda: 'return id(sleep_left) == 0;'
                then:
                  - script.execute: sleep_fire
                else:
                  - if:
                      condition:
                        lambda: 'return id(sleep_left) % 60 == 0;'
                      then:
                        - script.execute: redraw
  # verifica din 2 in 2 secunde daca Home Assistant e conectat (nu se mai lasa pacalit de alti clienti, ex. fereastra de Logs)
  - interval: 2s
    then:
      - if:
          condition:
            api.connected:
              state_subscription_only: true
          then:
            - if:
                condition:
                  lambda: 'return !id(api_up);'
                then:
                  - lambda: id(api_up) = true;
                  - script.execute: sync_ha
                  - script.execute: redraw
          else:
            - if:
                condition:
                  lambda: 'return id(api_up);'
                then:
                  - lambda: id(api_up) = false;
                  - script.execute: redraw
  # cere periodic starile entitatilor de la Home Assistant
  - interval: 5s
    then:
      - script.execute: sync_ha
  # mod noapte: recalculeaza luminozitatea dupa ora
  - interval: 20s
    then:
      - script.execute: bright_update
  # pagina de diagnostic se reimprospateaza cat e deschisa; la fel si ecranul de scadere a volumului
  - interval: 2s
    then:
      - if:
          condition:
            lambda: 'return (id(diag_vis) && id(view) == 0) || (id(fade_active) && id(view) == 0);'
          then:
            - component.update: lcd

# ================= SCRIPTURI =================
script:
  # reafisare cu mica intarziere (evita zeci de redesenari la pornire)
  - id: redraw
    mode: restart
    then:
      - delay: 100ms
      - component.update: lcd

  # reafisare dupa ce se termina clipirea butonului atins
  - id: redraw_late
    mode: restart
    then:
      - delay: 380ms
      - component.update: lcd

  # ===== ALARMA =====
  # verifica in fiecare minut (la secunda 0) daca e ora alarmei
  - id: alarm_check
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              if (!id(alarm_on)->state) return false;
              if (id(alarm_ringing)) return false;
              auto t = id(ha_time)->now();
              if (!t.is_valid()) t = id(sntp_time)->now();
              if (!t.is_valid()) return false;
              if (id(alarm_wd)->state) {
                if (t.day_of_week < 2 || t.day_of_week > 6) return false;
              }
              return t.hour == (int) id(alarm_h)->state && t.minute == (int) id(alarm_min)->state;
          then:
            - script.execute: alarm_ring

  # alarma suna: aprinde ecranul, apoi (daca e setat) lumina creste, apoi volumul, apoi suna complet; maximum 5 minute dupa trezire
  - id: alarm_ring
    mode: restart
    then:
      - lambda: |-
          id(alarm_ringing) = true;
          id(view) = 0;
          bool use_beep = (id(alarm_snd_idx) == 0) || !id(api_up);
          if (!use_beep) {
            int i = id(alarm_snd_idx) - 1;
            if (i < 0 || i > 3) {
              use_beep = true;
            } else {
              text::Text *a_fc[4] = {id(fav_c1), id(fav_c2), id(fav_c3), id(fav_c4)};
              if (a_fc[i]->state.empty()) use_beep = true;
              else id(fav_idx) = i;
            }
          }
          id(alarm_beep) = use_beep;
          id(alarm_steps) = ((int) id(alarm_ramp_min)->state) * 6;
          id(alarm_ramp) = id(alarm_steps) > 0;
          id(alarm_lvl) = 0;
          id(alarm_snd) = false;
          id(alarm_vol) = -1;
          id(alarm_prev_vol) = NAN;
          if (id(alarm_ramp) && use_beep) id(alarm_prev_vol) = id(external_media_player)->volume;
      - light.turn_on:
          id: backlight
          brightness: !lambda 'return id(act_bright);'
      - component.update: lcd
      # lumina de trezire porneste de la 1%
      - if:
          condition:
            lambda: 'return id(alarm_ramp) && id(api_up) && !id(alarm_light)->state.empty();'
          then:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda 'return id(alarm_light)->state;'
                  brightness_pct: "1"
      # trezire graduala: un pas la 10 s; prima jumatate doar lumina, a doua jumatate lumina + sunet cu volum crescator
      - repeat:
          count: !lambda 'return id(alarm_steps);'
          then:
            - if:
                condition:
                  lambda: 'return id(alarm_ringing);'
                then:
                  - lambda: |-
                      int n = id(alarm_steps);
                      int half = n / 2;
                      int st = (int) iteration + 1;
                      id(alarm_lvl) = st * 100 / n;
                      if (st > half) {
                        id(alarm_vol) = (id(alarm_vol_max)->state / 100.0f) * (float) (st - half) / (float) (n - half);
                      } else {
                        id(alarm_vol) = -1;
                      }
                  - if:
                      condition:
                        lambda: 'return id(api_up) && !id(alarm_light)->state.empty();'
                      then:
                        - homeassistant.action:
                            action: light.turn_on
                            data:
                              entity_id: !lambda 'return id(alarm_light)->state;'
                              brightness_pct: !lambda 'return str_sprintf("%d", id(alarm_lvl));'
                              transition: "10"
                  - if:
                      condition:
                        lambda: 'return id(alarm_vol) >= 0 && !id(alarm_beep) && id(api_up);'
                      then:
                        - homeassistant.action:
                            action: media_player.volume_set
                            data:
                              entity_id: !lambda 'return id(fav_player)->state;'
                              volume_level: !lambda 'return str_sprintf("%.2f", id(alarm_vol));'
                        - if:
                            condition:
                              lambda: 'return !id(alarm_snd);'
                            then:
                              - lambda: id(alarm_snd) = true;
                              - script.execute: fav_play
                  - if:
                      condition:
                        lambda: 'return id(alarm_vol) >= 0 && id(alarm_beep);'
                      then:
                        - media_player.volume_set:
                            id: external_media_player
                            volume: !lambda 'return id(alarm_vol);'
                        - media_player.speaker.play_on_device_media_file:
                            media_file: timer_finished_sound
                            announcement: true
                  - component.update: lcd
                  - delay: 10s
      - lambda: |-
          id(alarm_ramp) = false;
          id(alarm_lvl) = 100;
      # fara trezire graduala (sau fara sunet pornit inca): porneste favoritul acum
      - if:
          condition:
            lambda: 'return !id(alarm_beep) && !id(alarm_snd);'
          then:
            - lambda: id(alarm_snd) = true;
            - script.execute: fav_play
      - repeat:
          count: 75
          then:
            - if:
                condition:
                  lambda: 'return id(alarm_ringing);'
                then:
                  - light.turn_on:
                      id: led
                      red: 100%
                      green: 60%
                      blue: 0%
                      brightness: 60%
                  - if:
                      condition:
                        lambda: 'return id(alarm_beep);'
                      then:
                        - media_player.speaker.play_on_device_media_file:
                            media_file: timer_finished_sound
                            announcement: true
                  - delay: 2s
                  - light.turn_off: led
                  - delay: 2s
      - script.execute: alarm_dismiss

  # Stop: opreste sunetul, pune muzica pe pauza, scoate ecranul de alarma
  - id: alarm_dismiss
    mode: single
    then:
      - script.stop: alarm_ring
      - script.stop: alarm_snooze_wait
      - lambda: |-
          id(alarm_ringing) = false;
          id(alarm_ramp) = false;
          if (!std::isnan(id(alarm_prev_vol))) {
            auto vc = id(external_media_player)->make_call();
            vc.set_volume(id(alarm_prev_vol));
            vc.perform();
            id(alarm_prev_vol) = NAN;
          }
      - light.turn_off: led
      - if:
          condition:
            lambda: 'return !id(alarm_beep) && id(api_up);'
          then:
            - homeassistant.action:
                action: media_player.media_pause
                data:
                  entity_id: !lambda 'return id(fav_player)->state;'
      - script.execute: activity
      - component.update: lcd

  # Amana: opreste sunetul acum si reia alarma dupa numarul de minute setat
  - id: alarm_snooze
    mode: single
    then:
      - script.stop: alarm_ring
      - lambda: |-
          id(alarm_ringing) = false;
          id(alarm_ramp) = false;
          if (!std::isnan(id(alarm_prev_vol))) {
            auto vc = id(external_media_player)->make_call();
            vc.set_volume(id(alarm_prev_vol));
            vc.perform();
            id(alarm_prev_vol) = NAN;
          }
      - light.turn_off: led
      - if:
          condition:
            lambda: 'return !id(alarm_beep) && id(api_up);'
          then:
            - homeassistant.action:
                action: media_player.media_pause
                data:
                  entity_id: !lambda 'return id(fav_player)->state;'
      - script.execute: activity
      - component.update: lcd
      - script.execute: alarm_snooze_wait

  - id: alarm_snooze_wait
    mode: restart
    then:
      - delay: !lambda 'return (uint32_t) (id(alarm_snooze_min)->state * 60000.0f);'
      - script.execute: alarm_ring

  # reglaje de pe pagina Alarma: 40 ora+, 41 ora-, 42 minut+ (din 5 in 5), 43 minut-, 44 pornit/oprit
  - id: alarm_adjust
    mode: queued
    parameters:
      op: int
    then:
      - lambda: |-
          int h = (int) id(alarm_h)->state;
          int m = (int) id(alarm_min)->state;
          if (op == 40) h = (h + 1) % 24;
          if (op == 41) h = (h + 23) % 24;
          if (op == 42) m = (((m / 5) + 1) * 5) % 60;
          if (op == 43) {
            m = (((m + 4) / 5) - 1) * 5;
            if (m < 0) m += 60;
          }
          if (op >= 40 && op <= 43) {
            auto ch = id(alarm_h)->make_call();
            ch.set_value(h);
            ch.perform();
            auto cm = id(alarm_min)->make_call();
            cm.set_value(m);
            cm.perform();
          }
      - if:
          condition:
            lambda: 'return op == 44;'
          then:
            - switch.toggle: alarm_on

  # sleep timer: fiecare atingere pe luna trece la urmatoarea durata (Oprit, 15, 30, 45, 60, 90 min)
  - id: sleep_cycle
    mode: restart
    then:
      - select.next:
          id: sel_sleep
          cycle: true

  # sleep timer: cu <fade> secunde inainte de sfarsit, volumul scade lin in 10 trepte (doar daca playerul e unul din paginile Puck-ului)
  - id: sleep_fade
    mode: single
    then:
      - lambda: |-
          id(fade_v0) = -1;
          std::string pl = id(fav_player)->state;
          std::string *a_en[8] = {&id(en_1), &id(en_2), &id(en_3), &id(en_4), &id(en_5), &id(en_6), &id(en_7), &id(en_8)};
          int *a_kd[8] = {&id(kd_1), &id(kd_2), &id(kd_3), &id(kd_4), &id(kd_5), &id(kd_6), &id(kd_7), &id(kd_8)};
          sensor::Sensor *a_vo[8] = {id(vo_1), id(vo_2), id(vo_3), id(vo_4), id(vo_5), id(vo_6), id(vo_7), id(vo_8)};
          for (int i = 0; i < 8; i++) {
            if (*a_kd[i] == 3 && *a_en[i] == pl) {
              float v = a_vo[i]->state;
              if (!std::isnan(v) && v > 0.02f) id(fade_v0) = v;
            }
          }
          id(fade_active) = id(fade_v0) > 0;
          id(fade_ms) = millis();
      - if:
          condition:
            lambda: 'return id(fade_active);'
          then:
            - component.update: lcd
            - repeat:
                count: 10
                then:
                  - homeassistant.action:
                      action: media_player.volume_set
                      data:
                        entity_id: !lambda 'return id(fav_player)->state;'
                        volume_level: !lambda 'return str_sprintf("%.2f", id(fade_v0) * (9 - (int) iteration) / 10.0f);'
                  - delay: !lambda 'return (uint32_t) (id(num_fade)->state * 100.0f);'

  # sleep timer: cand expira, pune muzica pe pauza pe playerul din "Favorite - Player" si readuce volumul de dinainte
  - id: sleep_fire
    mode: single
    then:
      - homeassistant.action:
          action: media_player.media_pause
          data:
            entity_id: !lambda 'return id(fav_player)->state;'
      - if:
          condition:
            lambda: 'return id(fade_active) && id(fade_v0) > 0;'
          then:
            - delay: 2s
            - homeassistant.action:
                action: media_player.volume_set
                data:
                  entity_id: !lambda 'return id(fav_player)->state;'
                  volume_level: !lambda 'return str_sprintf("%.2f", id(fade_v0));'
      - lambda: id(fade_active) = false;
      - select.set:
          id: sel_sleep
          option: Oprit

  # pagina de start: Carduri
  - id: go_home
    mode: single
    then:
      - lambda: |-
          id(page) = 0;
          id(det_slot) = -1;
      - component.update: lcd

  # mod noapte: dupa ora, alege luminozitatea activa si cea de standby
  - id: bright_update
    mode: restart
    then:
      - lambda: |-
          auto t = id(ha_time)->now();
          if (!t.is_valid()) t = id(sntp_time)->now();
          bool night = false;
          if (t.is_valid() && id(night_on)->state) {
            int h = t.hour;
            int a = (int) id(night_from)->state;
            int b = (int) id(night_to)->state;
            if (a < b) night = (h >= a && h < b);
            else if (a > b) night = (h >= a || h < b);
          }
          id(night_now) = night;
          float act = id(num_bright)->state / 100.0f;
          float sb = id(num_dim)->state / 100.0f;
          if (night) {
            float na = id(night_act)->state / 100.0f;
            float nd = id(night_dim)->state / 100.0f;
            if (na < act) act = na;
            if (nd < sb) sb = nd;
          }
          id(act_bright) = act;
          id(sb_bright) = sb;
      - if:
          condition:
            lambda: 'return id(view) == 2 && !id(alarm_ringing);'
          then:
            - light.turn_on:
                id: backlight
                brightness: !lambda 'return id(sb_bright);'

  # sonerie: ascunde fereastra dupa 30 s daca nu s-a atins nimic
  - id: door_guard
    mode: restart
    then:
      - delay: 30s
      - lambda: id(door_show) = false;
      - component.update: lcd

  # trimite catre Home Assistant lista de entitati a acestui Puck; automatizarea raspunde cu starile lor
  - id: sync_ha
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(api_up);'
          then:
            - homeassistant.event:
                event: esphome.puck_sync
                data:
                  device: ${name}
                  e1: !lambda 'return id(en_1);'
                  e2: !lambda 'return id(en_2);'
                  e3: !lambda 'return id(en_3);'
                  e4: !lambda 'return id(en_4);'
                  e5: !lambda 'return id(en_5);'
                  e6: !lambda 'return id(en_6);'
                  e7: !lambda 'return id(en_7);'
                  e8: !lambda 'return id(en_8);'

  # pornește un favorit (radio / playlist) din Music Assistant pe boxa aleasa
  - id: fav_play
    mode: queued
    then:
      - lambda: |-
          int i = id(fav_idx);
          id(cmd_mode) = -1;
          if (i < 0 || i > 3) return;
          text::Text *a_fc[4] = {id(fav_c1), id(fav_c2), id(fav_c3), id(fav_c4)};
          int *a_ft[4] = {&id(fav_ty1), &id(fav_ty2), &id(fav_ty3), &id(fav_ty4)};
          static const char *FT[5] = {"radio", "playlist", "album", "track", "artist"};
          std::string mid = a_fc[i]->state;
          std::string pl = id(fav_player)->state;
          int t = *a_ft[i];
          if (t < 0 || t > 4) t = 0;
          if (mid.empty() || pl.empty()) return;
          id(cmd_entity) = pl;
          id(fav_media) = mid;
          id(fav_type) = FT[t];
          id(cmd_mode) = 8;
      - if:
          condition:
            lambda: 'return id(cmd_mode) == 8;'
          then:
            - homeassistant.action:
                action: music_assistant.play_media
                data:
                  entity_id: !lambda 'return id(cmd_entity);'
                  media_id: !lambda 'return id(fav_media);'
                  media_type: !lambda 'return id(fav_type);'
                  enqueue: play

  # siguranta: daca asistentul vocal ramane blocat pe ecran, il scoate dupa 30 s
  - id: va_guard
    mode: restart
    then:
      - delay: 30s
      - if:
          condition:
            lambda: 'return id(va_phase) != 0;'
          then:
            - lambda: id(va_phase) = 0;
            - light.turn_off: led
            - script.execute: redraw

  # dupa timpul setat fara atingeri intra in standby (ceas, ecran estompat); nu intra cat suna alarma
  - id: activity
    mode: restart
    then:
      - delay: !lambda 'return (uint32_t) (id(num_standby)->state * 1000.0f);'
      - if:
          condition:
            lambda: 'return !id(alarm_ringing);'
          then:
            - lambda: |-
                id(view) = 2;
                id(page) = 0;
                id(det_slot) = -1;
            - light.turn_on:
                id: backlight
                brightness: !lambda 'return id(sb_bright);'
            - component.update: lcd

  # op: 0 = comuta, 1 = plus, 2 = minus, 3 = anterior, 4 = play/pauza, 5 = urmator, 7 = volum absolut
  - id: slot_cmd
    mode: queued
    parameters:
      op: int
    then:
      - lambda: |-
          int s = (id(cmd_slot) >= 0) ? id(cmd_slot) : id(det_slot);
          id(cmd_slot) = -1;
          id(cmd_mode) = -1;
          if (s < 0 || s > 7) return;
          std::string *a_en[8] = {&id(en_1), &id(en_2), &id(en_3), &id(en_4), &id(en_5), &id(en_6), &id(en_7), &id(en_8)};
          int *a_kd[8] = {&id(kd_1), &id(kd_2), &id(kd_3), &id(kd_4), &id(kd_5), &id(kd_6), &id(kd_7), &id(kd_8)};
          text_sensor::TextSensor *a_st[8] = {id(st_1), id(st_2), id(st_3), id(st_4), id(st_5), id(st_6), id(st_7), id(st_8)};
          sensor::Sensor *a_br[8] = {id(br_1), id(br_2), id(br_3), id(br_4), id(br_5), id(br_6), id(br_7), id(br_8)};
          sensor::Sensor *a_tg[8] = {id(tg_1), id(tg_2), id(tg_3), id(tg_4), id(tg_5), id(tg_6), id(tg_7), id(tg_8)};
          sensor::Sensor *a_vo[8] = {id(vo_1), id(vo_2), id(vo_3), id(vo_4), id(vo_5), id(vo_6), id(vo_7), id(vo_8)};
          id(cmd_entity) = *a_en[s];
          int kind = *a_kd[s];
          if (kind == 4) return;   // senzorii nu se comanda
          if (kind == 3) {
            if (op == 0 || op == 4) {
              bool playing_now = (a_st[s]->state == "playing");
              a_st[s]->publish_state(playing_now ? "paused" : "playing");
              id(cmd_mode) = playing_now ? 7 : 4;
              return;
            }
            if (op == 5) { id(cmd_mode) = 5; return; }
            if (op == 3) { id(cmd_mode) = 6; return; }
            float v = a_vo[s]->state;
            if (op == 7) {
              v = id(ui_val);
            } else {
              if (std::isnan(v)) v = 0.3f;
              v += (op == 1) ? 0.05f : -0.05f;
            }
            if (v < 0.0f) v = 0.0f;
            if (v > 1.0f) v = 1.0f;
            v = roundf(v * 100.0f) / 100.0f;
            a_vo[s]->publish_state(v);
            id(cmd_val) = v;
            id(cmd_mode) = 3;
            return;
          }
          if (op == 0 || kind == 0) {
            id(cmd_mode) = 0;
            return;
          }
          if (kind == 1) {
            float b = a_br[s]->state;
            int pct = std::isnan(b) ? 0 : (int) roundf(b * 100.0f / 255.0f);
            pct += (op == 1) ? 10 : -10;
            if (pct < 1) pct = 1;
            if (pct > 100) pct = 100;
            id(cmd_val) = pct;
            a_br[s]->publish_state(pct * 255.0f / 100.0f);
            id(cmd_mode) = 1;
          } else {
            float t = a_tg[s]->state;
            if (std::isnan(t)) t = 22.0f;
            t += (op == 1) ? 0.5f : -0.5f;
            if (t < 16.0f) t = 16.0f;
            if (t > 30.0f) t = 30.0f;
            id(cmd_val) = t;
            a_tg[s]->publish_state(t);
            id(cmd_mode) = 2;
          }
      - script.execute: redraw
      - if:
          condition:
            lambda: 'return id(cmd_mode) == 0;'
          then:
            - homeassistant.action:
                action: homeassistant.toggle
                data:
                  entity_id: !lambda 'return id(cmd_entity);'
      - if:
          condition:
            lambda: 'return id(cmd_mode) == 1;'
          then:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda 'return id(cmd_entity);'
                  brightness_pct: !lambda 'return str_sprintf("%d", (int) id(cmd_val));'
      - if:
          condition:
            lambda: 'return id(cmd_mode) == 2;'
          then:
            - homeassistant.action:
                action: climate.set_temperature
                data:
                  entity_id: !lambda 'return id(cmd_entity);'
                  temperature: !lambda 'return str_sprintf("%.1f", id(cmd_val));'
      - if:
          condition:
            lambda: 'return id(cmd_mode) == 3;'
          then:
            - homeassistant.action:
                action: media_player.volume_set
                data:
                  entity_id: !lambda 'return id(cmd_entity);'
                  volume_level: !lambda 'return str_sprintf("%.2f", id(cmd_val));'
      - if:
          condition:
            lambda: 'return id(cmd_mode) == 4;'
          then:
            - homeassistant.action:
                action: media_player.media_play
                data:
                  entity_id: !lambda 'return id(cmd_entity);'
      - if:
          condition:
            lambda: 'return id(cmd_mode) == 7;'
          then:
            - homeassistant.action:
                action: media_player.media_pause
                data:
                  entity_id: !lambda 'return id(cmd_entity);'
      - if:
          condition:
            lambda: 'return id(cmd_mode) == 5;'
          then:
            - homeassistant.action:
                action: media_player.media_next_track
                data:
                  entity_id: !lambda 'return id(cmd_entity);'
      - if:
          condition:
            lambda: 'return id(cmd_mode) == 6;'
          then:
            - homeassistant.action:
                action: media_player.media_previous_track
                data:
                  entity_id: !lambda 'return id(cmd_entity);'
      # cere Home Assistant sa trimita imediat starea noua
      - delay: 600ms
      - script.execute: sync_ha

# ================= ECRANUL (rotit 180 grade) =================
display:
  - platform: ili9xxx
    id: lcd
    model: GC9A01A
    invert_colors: true
    data_rate: 40MHz
    cs_pin: GPIO5
    dc_pin: GPIO47
    reset_pin: GPIO38
    rotation: 180
    dimensions:
      width: 240
      height: 240
    update_interval: never
    lambda: |-
      it.fill(Color::BLACK);
      static const char *ICONS[12] = {
        "\U000F0335", "\U000F0425", "\U000F0502", "\U000F0210", "\U000F033E",
        "\U000F050F", "\U000F0387", "\U000F02DC", "\U000F06D9", "\U000F01F8",
        "\U000F00AC", "\U000F0238"
      };
      // culoarea fiecarei iconite: Bec, Power, TV, Ventilator, Incuietoare, Termostat,
      // Muzica, Acasa, Garaj, AC, Jaluzele, Incalzire
      static const uint32_t ICC[12] = {
        0xFFC107, 0xFF5252, 0x42A5F5, 0x4DD0E1, 0xEF5350, 0xFF7043,
        0xAB47BC, 0x66BB6A, 0xFFA726, 0x29B6F6, 0xD7B98E, 0xFF5722
      };
      // teme: Chihlimbar, Albastru, Verde, Rosu, Violet, Alb
      static const uint32_t ACC[6] = {0xFFC107, 0x42A5F5, 0x66BB6A, 0xEF5350, 0xAB47BC, 0xECEFF1};
      static const uint32_t ACB[6] = {0x4A3B00, 0x0D2B4A, 0x14381A, 0x4A1614, 0x30143A, 0x3A3F42};
      int th = id(theme);
      if (th < 0 || th > 5) th = 0;
      Color accent = Color(ACC[th]);
      Color accent_bg = Color(ACB[th]);
      Color grey_bg = Color(0x262626);

      std::string *a_nm[8] = {&id(nm_1), &id(nm_2), &id(nm_3), &id(nm_4), &id(nm_5), &id(nm_6), &id(nm_7), &id(nm_8)};
      int *a_ic[8] = {&id(ic_1), &id(ic_2), &id(ic_3), &id(ic_4), &id(ic_5), &id(ic_6), &id(ic_7), &id(ic_8)};
      int *a_kd[8] = {&id(kd_1), &id(kd_2), &id(kd_3), &id(kd_4), &id(kd_5), &id(kd_6), &id(kd_7), &id(kd_8)};
      text_sensor::TextSensor *a_st[8] = {id(st_1), id(st_2), id(st_3), id(st_4), id(st_5), id(st_6), id(st_7), id(st_8)};
      text_sensor::TextSensor *a_ti[8] = {id(ti_1), id(ti_2), id(ti_3), id(ti_4), id(ti_5), id(ti_6), id(ti_7), id(ti_8)};
      sensor::Sensor *a_br[8] = {id(br_1), id(br_2), id(br_3), id(br_4), id(br_5), id(br_6), id(br_7), id(br_8)};
      sensor::Sensor *a_tg[8] = {id(tg_1), id(tg_2), id(tg_3), id(tg_4), id(tg_5), id(tg_6), id(tg_7), id(tg_8)};
      sensor::Sensor *a_cu[8] = {id(cu_1), id(cu_2), id(cu_3), id(cu_4), id(cu_5), id(cu_6), id(cu_7), id(cu_8)};
      sensor::Sensor *a_vo[8] = {id(vo_1), id(vo_2), id(vo_3), id(vo_4), id(vo_5), id(vo_6), id(vo_7), id(vo_8)};
      sensor::Sensor *a_po[8] = {id(po_1), id(po_2), id(po_3), id(po_4), id(po_5), id(po_6), id(po_7), id(po_8)};
      sensor::Sensor *a_du[8] = {id(du_1), id(du_2), id(du_3), id(du_4), id(du_5), id(du_6), id(du_7), id(du_8)};
      number::Number *a_mn[8] = {id(num_min_1), id(num_min_2), id(num_min_3), id(num_min_4), id(num_min_5), id(num_min_6), id(num_min_7), id(num_min_8)};
      number::Number *a_mx[8] = {id(num_max_1), id(num_max_2), id(num_max_3), id(num_max_4), id(num_max_5), id(num_max_6), id(num_max_7), id(num_max_8)};
      auto is_on = [&](int s) -> bool {
        std::string v = a_st[s]->state;
        int k = *a_kd[s];
        if (k == 3) return v == "playing" || v == "buffering" || v == "on";
        if (k == 4) return !(v.empty() || v == "unavailable" || v == "unknown");
        return !(v.empty() || v == "off" || v == "unavailable" || v == "unknown" || v == "closed" || v == "idle" || v == "standby");
      };
      // valoare numerica de senzor, cu o zecimala ("--" daca nu e numar)
      auto fmt_val = [](const std::string &st, char *out, size_t n) {
        char *end = nullptr;
        float v = strtof(st.c_str(), &end);
        if (st.empty() || end == st.c_str()) {
          snprintf(out, n, "--");
          return;
        }
        if (fabsf(v) >= 100.0f) snprintf(out, n, "%.0f", v);
        else snprintf(out, n, "%.1f", v);
      };
      auto utf8_take = [](const std::string &str, size_t start, size_t maxb) -> std::string {
        if (start >= str.size()) return std::string("");
        size_t end = start + maxb;
        if (end >= str.size()) return str.substr(start);
        while (end > start && (((unsigned char) str[end]) & 0xC0) == 0x80) end--;
        return str.substr(start, end - start);
      };
      auto tri_r = [&](int cx, int cy, int h, Color c) {
        for (int i = 0; i < h; i++) {
          int len = h - i;
          it.vertical_line(cx - h / 2 + i, cy - len / 2, len, c);
        }
      };
      auto tri_l = [&](int cx, int cy, int h, Color c) {
        for (int i = 0; i < h; i++) {
          int len = h - i;
          it.vertical_line(cx + h / 2 - i, cy - len / 2, len, c);
        }
      };
      // amestec intre doua culori (t = 0 -> a, t = 1 -> b)
      auto mixc = [](Color a, Color b, float t) -> Color {
        if (t < 0.0f) t = 0.0f;
        if (t > 1.0f) t = 1.0f;
        int r = (int) a.r + (int) (((int) b.r - (int) a.r) * t);
        int g = (int) a.g + (int) (((int) b.g - (int) a.g) * t);
        int bl = (int) a.b + (int) (((int) b.b - (int) a.b) * t);
        return Color((uint8_t) r, (uint8_t) g, (uint8_t) bl);
      };
      // intuneca randurile y0..y1 ale imaginii de fundal (lvl 1 = aprox. 50%, lvl 2 = aprox. 75%), ca textul sa se citeasca
      auto dim_rows = [&](int y0, int y1, int lvl) {
        for (int yy = y0; yy < y1; yy++) {
          for (int xx = 0; xx < 240; xx++) {
            bool keep = (lvl == 1) ? (((xx + yy) & 1) == 0) : (((xx & 1) == 0) && ((yy & 1) == 0));
            if (!keep) it.draw_pixel_at(xx, yy, Color::BLACK);
          }
        }
      };
      // scara de temperatura: 0 = albastru, 0.4 = cian, 0.6 = galben, 1 = rosu
      auto tcol = [&](float f) -> Color {
        if (f < 0.0f) f = 0.0f;
        if (f > 1.0f) f = 1.0f;
        Color c0 = Color(0x2F6BFF);
        Color c1 = Color(0x35D0FF);
        Color c2 = Color(0xFFD54F);
        Color c3 = Color(0xFF3D3D);
        if (f < 0.4f) return mixc(c0, c1, f / 0.4f);
        if (f < 0.6f) return mixc(c1, c2, (f - 0.4f) / 0.2f);
        return mixc(c2, c3, (f - 0.6f) / 0.4f);
      };
      // iconita colorata: plina cand e pornita, estompata (dar tot colorata) cand e oprita
      auto icon_color = [&](int ic, bool on) -> Color {
        Color base = Color(ICC[ic]);
        return on ? base : mixc(base, Color(0x000000), 0.45f);
      };
      auto icon_bg = [&](int ic, bool on) -> Color {
        Color base = Color(ICC[ic]);
        return mixc(base, Color(0x000000), on ? 0.78f : 0.9f);
      };
      // Inel continuu: arc de 270 grade, gol jos, de la stanga-jos peste sus spre dreapta-jos.
      // vmin..vmax = intervalul, lo..hi = partea aprinsa, mk = marcajul alb, cu = punctul mic (valoarea curenta)
      // gm: 0 = culoare simpla
      //     1 = degrade deschis -> inchis pe culoarea temei (galben deschis -> galben inchis la tema implicita)
      //     2 = scara albastru-rosu (temperatura)
      //     3 = scara albastru-rosu, cu urma estompata in afara zonei aprinse
      auto draw_ring = [&](float vmin, float vmax, float lo, float hi, float mk, float cu, Color col, int gm) {
        auto ang = [&](float v) -> float {
          if (v < vmin) v = vmin;
          if (v > vmax) v = vmax;
          return (135.0f + (v - vmin) / (vmax - vmin) * 270.0f) * 0.0174533f;
        };
        // urma (fundalul inelului)
        for (float d = 0.0f; d <= 270.0f; d += 1.5f) {
          float a = (135.0f + d) * 0.0174533f;
          Color tr = (gm == 3) ? mixc(tcol(d / 270.0f), Color(0x000000), 0.78f) : Color(0x2A2A2A);
          it.filled_circle(120 + (int) (107.0f * cosf(a)), 120 + (int) (107.0f * sinf(a)), 5, tr);
        }
        // partea aprinsa
        if (!std::isnan(lo) && !std::isnan(hi) && hi > lo) {
          float d0 = (lo - vmin) / (vmax - vmin) * 270.0f;
          float d1 = (hi - vmin) / (vmax - vmin) * 270.0f;
          if (d0 < 0.0f) d0 = 0.0f;
          if (d1 > 270.0f) d1 = 270.0f;
          for (float d = d0; d <= d1; d += 1.5f) {
            float a = (135.0f + d) * 0.0174533f;
            float frac = d / 270.0f;
            Color c = col;
            if (gm == 1) c = mixc(mixc(col, Color(0xFFFFFF), 0.55f), mixc(col, Color(0x000000), 0.25f), frac);
            else if (gm >= 2) c = tcol(frac);
            it.filled_circle(120 + (int) (107.0f * cosf(a)), 120 + (int) (107.0f * sinf(a)), 5, c);
          }
        }
        if (!std::isnan(cu)) {
          float a = ang(cu);
          float cf = (cu - vmin) / (vmax - vmin);
          it.filled_circle(120 + (int) (90 * cosf(a)), 120 + (int) (90 * sinf(a)), 3, (gm >= 2) ? tcol(cf) : col);
        }
        if (!std::isnan(mk)) {
          float a = ang(mk);
          it.filled_circle(120 + (int) (107 * cosf(a)), 120 + (int) (107 * sinf(a)), 7, Color::WHITE);
        }
      };
      char buf[48];
      float bat = id(battery_percentage)->state;
      int np = (int) id(num_pages)->state;
      if (np < 1) np = 1;
      if (np > 8) np = 8;
      // cardurile principale: primul slot de fiecare fel (lumina, clima, muzica); restul merg pe paginile "Mai multe"
      int m1 = -1, m2 = -1, m3 = -1, m4 = -1;
      for (int i = 0; i < np; i++) {
        int k = *a_kd[i];
        if (k == 1 && m1 < 0) m1 = i;
        if (k == 2 && m2 < 0) m2 = i;
        if (k == 3 && m3 < 0) m3 = i;
        if (k == 4 && m4 < 0) m4 = i;
      }
      if (m2 < 0) m2 = m4;
      int rest[8];
      int nr = 0;
      for (int i = 0; i < np; i++) {
        if (i != m1 && i != m2 && i != m3) rest[nr++] = i;
      }
      int nmore = (nr + 3) / 4;
      // ordinea paginilor: Carduri, Mai multe, Favorite, Alarma, Diagnostic
      int pi = 1, pmore = -1, pfav = -1, palm = -1, pdiag = -1;
      if (nmore > 0) { pmore = pi; pi += nmore; }
      if (id(fav_on)->state) pfav = pi++;
      if (id(alarm_pg)->state) palm = pi++;
      if (id(diag_pg)->state) pdiag = pi++;
      int np2 = pi;
      int ds = id(det_slot);
      if (ds >= np) ds = -1;
      id(diag_vis) = false;
      bool fl = ((uint32_t) (millis() - id(flash_ms))) < 350;
      int fop = id(flash_op);

      if (id(alarm_ringing)) {
        // ---------- ALARMA SUNA: ora mare, Amana / Stop ----------
        int fr = id(va_frame);
        auto now = id(ha_time)->now(); if (!now.is_valid()) now = id(sntp_time)->now();
        if (now.is_valid()) snprintf(buf, sizeof(buf), "%02d:%02d", now.hour, now.minute);
        else snprintf(buf, sizeof(buf), "--:--");
        int pr = 110 + ((fr / 3) % 2) * 3;
