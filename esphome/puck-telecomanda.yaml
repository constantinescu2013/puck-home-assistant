      - lambda: id(alarm_snd_idx) = i;

# ================= SENZORI =================
sensor:
  - platform: adc
    pin: GPIO1
    name: "Baterie - Tensiune"
    id: battery_voltage
    attenuation: 12db
    accuracy_decimals: 2
    update_interval: 1s
    unit_of_measurement: "V"
    icon: mdi:battery-medium
    filters:
      - multiply: 2.0
      - median:
          window_size: 7
          send_every: 7
          send_first_at: 7
      - throttle: 1min
    on_value:
      then:
        - component.update: battery_percentage

  - platform: template
    id: battery_percentage
    name: "Baterie"
    lambda: return id(battery_voltage).state;
    update_interval: never
    accuracy_decimals: 0
    unit_of_measurement: "%"
    device_class: battery
    filters:
      - calibrate_linear:
          method: exact
          datapoints:
            - 2.80 -> 0.0
            - 3.10 -> 10.0
            - 3.30 -> 20.0
            - 3.45 -> 30.0
            - 3.60 -> 40.0
            - 3.70 -> 50.0
            - 3.75 -> 60.0
            - 3.80 -> 70.0
            - 3.90 -> 80.0
            - 4.00 -> 90.0
            - 4.20 -> 100.0
      - lambda: |-
          if (x > 100) return 100;
          if (x < 0) return 0;
          return x;
    on_value:
      then:
        - script.execute: redraw

  - platform: template
    name: "Sleep timer - ramas"
    id: sleep_rem
    unit_of_measurement: "min"
    accuracy_decimals: 0
    update_interval: never

  # temperatura de afara (atributul "temperature" al entitatii de vreme), pentru ceasul din standby
  - platform: homeassistant
    id: wx_temp
    entity_id: ${weather_entity}
    attribute: temperature
    internal: true

  - platform: wifi_signal
    id: wifi_sig
    name: "Semnal WiFi"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "Adresa IP"
  - platform: template
    name: "Ultima comanda vocala"
    id: ts_req
  - platform: template
    name: "Ultimul raspuns vocal"
    id: ts_resp
  # starea vremii (sunny, rainy, cloudy...), pentru pictograma din standby
  - platform: homeassistant
    id: wx_state
    entity_id: ${weather_entity}
    internal: true
  # adresa imaginii curente (poza de album sau logoul postului); cand se schimba, Puck-ul o descarca
  - platform: homeassistant
    id: art_path
    entity_id: ${art_entity}
    attribute: entity_picture
    internal: true
    on_value:
      then:
        - if:
            condition:
              lambda: 'return !x.empty() && x != "unknown" && x != "None";'
            then:
              - online_image.set_url:
                  id: art_img
                  url: !lambda |-
                    if (x.rfind("http", 0) == 0) return x;
                    return std::string("${ha_url}") + x;
              - component.update: art_img
            else:
              - lambda: id(art_ok) = false;
              - script.execute: redraw

# ================= HARDWARE (pini din fisierul Ball V2 / Puck) =================
output:
  - platform: ledc
    pin: GPIO42
    id: backlight_output
    inverted: true

light:
  - platform: monochromatic
    id: backlight
    name: "Ecran"
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms
  - platform: esp32_rmt_led_strip
    id: led
    name: "LED RGB"
    pin: GPIO48
    chipset: WS2812
    num_leds: 1
    rgb_order: grb
    default_transition_length: 0s

spi:
  clk_pin: GPIO4
  mosi_pin: GPIO2

i2c:
  - id: bus_a
    sda: GPIO15
    scl: GPIO14
    scan: true
  - id: bus_b
    sda: GPIO11
    scl: GPIO7
    scan: true

# ================= AUDIO (microfon + difuzor, din fisierul Ball V2) =================
i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO45
    i2s_bclk_pin: GPIO9
    i2s_mclk_pin: GPIO16

audio_dac:
  - platform: es8311
    i2c_id: bus_a
    id: es8311_dac
    bits_per_sample: 16bit
    sample_rate: 16000

microphone:
  - platform: i2s_audio
    id: i2s_mics
    sample_rate: 16000
    i2s_din_pin: GPIO10
    bits_per_sample: 16bit
    adc_type: external
    channel: left

speaker:
  - platform: i2s_audio
    id: i2s_audio_speaker
    i2s_dout_pin: GPIO8
    dac_type: external
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: left
    audio_dac: es8311_dac
    buffer_duration: 100ms

media_player:
  - platform: speaker
    name: "Difuzor"
    id: external_media_player
    announcement_pipeline:
      speaker: i2s_audio_speaker
      format: FLAC
      sample_rate: 16000
      num_channels: 1
    files:
      - id: wake_word_triggered_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/wake_word_triggered.flac
      - id: timer_finished_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/timer_finished.flac
    on_announcement:
      - if:
          condition:
            - microphone.is_capturing:
          then:
            - micro_wake_word.stop:
    on_idle:
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            - micro_wake_word.start:

micro_wake_word:
  id: mww
  models:
    - ${wake_word}
  on_wake_word_detected:
    - lambda: |-
        if (id(view) == 2) id(view) = 0;
        id(va_frame) = 0;
        id(va_phase) = 1;
    - light.turn_on:
        id: backlight
        brightness: !lambda 'return id(act_bright);'
    - script.execute: activity
    - script.execute: va_guard
    - component.update: lcd
    - media_player.speaker.play_on_device_media_file:
        media_file: wake_word_triggered_sound
        announcement: true
    - delay: 300ms
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: i2s_mics
  media_player: external_media_player
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_listening:
    - lambda: id(va_phase) = 1;
    - text_sensor.template.publish:
        id: ts_req
        state: ""
    - text_sensor.template.publish:
        id: ts_resp
        state: ""
    - light.turn_on:
        id: led
        red: 0%
        green: 40%
        blue: 100%
        brightness: 40%
    - script.execute: va_guard
    - script.execute: redraw
  on_stt_vad_end:
    - lambda: id(va_phase) = 2;
    - light.turn_on:
        id: led
        red: 100%
        green: 60%
        blue: 0%
        brightness: 40%
    - script.execute: va_guard
    - script.execute: redraw
  on_stt_end:
    - text_sensor.template.publish:
        id: ts_req
        state: !lambda 'return x.substr(0, 250);'
    - script.execute: redraw
  on_tts_start:
    - text_sensor.template.publish:
        id: ts_resp
        state: !lambda 'return x.substr(0, 250);'
    - lambda: id(va_phase) = 3;
    - light.turn_on:
        id: led
        red: 0%
        green: 100%
        blue: 30%
        brightness: 40%
    - script.execute: va_guard
    - script.execute: redraw
  on_end:
    - wait_until:
        condition:
          - media_player.is_announcing:
        timeout: 0.5s
    - wait_until:
        - and:
            - not:
                media_player.is_announcing:
            - not:
                speaker.is_playing:
    - lambda: id(va).set_use_wake_word(false);
    - micro_wake_word.start:
    - lambda: id(va_phase) = 0;
    - light.turn_off: led
    - script.execute: redraw
  on_error:
    - lambda: id(va_phase) = 4;
    - light.turn_on:
        id: led
        red: 100%
        green: 0%
        blue: 0%
        brightness: 40%
    - script.execute: redraw
    - delay: 1s
    - lambda: id(va_phase) = 0;
    - light.turn_off: led
    - script.execute: redraw
  on_client_connected:
    - lambda: id(va).set_use_wake_word(false);
    - micro_wake_word.start:
  on_client_disconnected:
    - micro_wake_word.stop:

switch:
  - platform: template
    name: "Microfon - mut"
    id: mic_mute
    icon: mdi:microphone-off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - microphone.mute:
    on_turn_off:
      - microphone.unmute:
  - platform: template
    name: "Pagina favorite"
    id: fav_on
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    on_turn_on:
      - script.execute: redraw
    on_turn_off:
      - script.execute: redraw
  # poza de album / logo radio pe fundalul paginii de muzica
  - platform: template
    name: "Media - poza de fundal"
    id: art_bg_on
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    on_turn_on:
      - script.execute: redraw
    on_turn_off:
      - script.execute: redraw
  # ---- alarma ----
  - platform: template
    name: "Alarma activa"
    id: alarm_on
    icon: mdi:alarm
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: redraw
    on_turn_off:
      - script.execute: redraw
  - platform: template
    name: "Alarma - doar Luni-Vineri"
    id: alarm_wd
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: redraw
    on_turn_off:
      - script.execute: redraw
  - platform: template
    name: "Pagina alarma"
    id: alarm_pg
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    on_turn_on:
      - script.execute: redraw
    on_turn_off:
      - script.execute: redraw
  # pagina cu carduri (prima pagina la pornire) si pagina de diagnostic
  - platform: template
    name: "Pagina carduri"
    id: card_pg
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    on_turn_on:
      - script.execute: redraw
    on_turn_off:
      - script.execute: redraw
  - platform: template
    name: "Pagina diagnostic"
    id: diag_pg
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    on_turn_on:
      - script.execute: redraw
    on_turn_off:
      - script.execute: redraw
  # sunetul soneriei pe difuzorul Puck-ului
  - platform: template
    name: "Sonerie - sunet"
    id: door_snd
    icon: mdi:bell-ring
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
  - platform: template
    name: "Mod noapte automat"
    id: night_on
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
  - platform: gpio
    name: "Amplificator difuzor"
    pin: GPIO46
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON

button:
  - platform: template
    name: "Alarma - test"
    id: btn_alarm_test
    on_press:
      - script.execute: alarm_ring
  - platform: template
    name: "Alarma - opreste"
    id: btn_alarm_stop
    on_press:
      - script.execute: alarm_dismiss

event:
  - platform: template
    name: "Buton fizic"
    id: ev_button
    device_class: button
    event_types:
      - click
      - double_click
      - long_press

binary_sensor:
  # butonul BOOT (GPIO0): click = trezeste ecranul, dublu-click = mut microfon, apasare lunga = asistent vocal
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
      ignore_strapping_warning: true
    internal: true
    id: btn_back
    on_press:
      - lambda: id(view) = 0;
      - light.turn_on:
          id: backlight
          brightness: !lambda 'return id(act_bright);'
      - script.execute: activity
      - component.update: lcd
    on_multi_click:
      - timing:
          - ON for at most 1s
          - OFF for at least 0.4s
        then:
          - event.trigger:
              id: ev_button
              event_type: click
      - timing:
          - ON for at most 1s
          - OFF for at most 0.4s
          - ON for at most 1s
          - OFF for at least 0.2s
        then:
          - event.trigger:
              id: ev_button
              event_type: double_click
          - switch.toggle: mic_mute
      - timing:
          - ON for at least 1s
        then:
          - event.trigger:
              id: ev_button
              event_type: long_press
          - if:
              condition:
                voice_assistant.is_running:
              then:
                - voice_assistant.stop:
              else:
                - voice_assistant.start:

# Ecranul e rotit 180 grade, deci coordonatele atingerii sunt inversate (239 - x, 239 - y)
touchscreen:
  - platform: cst816
    id: touch_dp
    i2c_id: bus_b
    interrupt_pin: GPIO12
    reset_pin: GPIO6
    on_touch:
      - lambda: |-
          if (!id(touching)) {
            id(touching) = true;
            id(tx0) = 239 - touch.x;
            id(ty0) = 239 - touch.y;
            id(ignore_rel) = (id(view) == 2) || (id(va_phase) > 0) || !id(backlight)->current_values.is_on();
            if (id(view) == 2) id(view) = 0;
          }
          id(tx) = 239 - touch.x;
          id(ty) = 239 - touch.y;
      - if:
          condition:
            lambda: 'return id(va_phase) > 0;'
          then:
            - voice_assistant.stop:
      - light.turn_on:
          id: backlight
          brightness: !lambda 'return id(act_bright);'
      - script.execute: activity
      - if:
          condition:
            lambda: 'return id(ignore_rel);'
          then:
            - component.update: lcd
    on_update:
      - lambda: |-
          if (!touches.empty()) {
            id(tx) = 239 - touches[0].x;
            id(ty) = 239 - touches[0].y;
          }
    on_release:
      - if:
          condition:
            lambda: 'return id(ignore_rel);'
          then:
            - lambda: |-
                id(ignore_rel) = false;
                id(touching) = false;
          else:
            - lambda: |-
                id(touching) = false;
                id(ui_op) = -1;
                int x = id(tx), y = id(ty);
                int dx = id(tx) - id(tx0);
                int dy = id(ty) - id(ty0);
                int np = (int) id(num_pages)->state;
                if (np < 1) np = 1;
                if (np > 8) np = 8;
                int *a_kd[8] = {&id(kd_1), &id(kd_2), &id(kd_3), &id(kd_4), &id(kd_5), &id(kd_6), &id(kd_7), &id(kd_8)};
                // cardurile principale: primul slot de fiecare fel (lumina, clima, muzica); restul merg pe paginile "Mai multe"
                int m1 = -1, m2 = -1, m3 = -1, m4 = -1;
                for (int i = 0; i < np; i++) {
                  int k = *a_kd[i];
                  if (k == 1 && m1 < 0) m1 = i;
                  if (k == 2 && m2 < 0) m2 = i;
                  if (k == 3 && m3 < 0) m3 = i;
                  if (k == 4 && m4 < 0) m4 = i;
                }
                if (m2 < 0) m2 = m4;
                int rest[8];
                int nr = 0;
                for (int i = 0; i < np; i++) {
                  if (i != m1 && i != m2 && i != m3) rest[nr++] = i;
                }
                int nmore = (nr + 3) / 4;
                // ordinea paginilor: Carduri, Mai multe, Favorite, Alarma, Diagnostic
                int pi = 1, pmore = -1, pfav = -1, palm = -1, pdiag = -1;
                if (nmore > 0) { pmore = pi; pi += nmore; }
                if (id(fav_on)->state) pfav = pi++;
                if (id(alarm_pg)->state) palm = pi++;
                if (id(diag_pg)->state) pdiag = pi++;
                int np2 = pi;
                if (id(page) < 0 || id(page) >= np2) id(page) = 0;
                int pg = id(page);
                bool cardp = (pg == 0);
                bool morep = (pmore >= 0 && pg >= pmore && pg < pmore + nmore);
                bool favp = (pg == pfav);
                bool alp = (pg == palm);
                bool diagp = (pg == pdiag);
                int ds = id(det_slot);
                if (ds >= np) { id(det_slot) = -1; ds = -1; }
                int kind = (ds >= 0) ? *a_kd[ds] : -1;
                if (id(alarm_ringing)) {
                  // alarma suna: 31 = amana, 30 = stop
                  if ((x - 76) * (x - 76) + (y - 170) * (y - 170) < 40 * 40) {
                    id(ui_op) = 31;
                  } else if ((x - 164) * (x - 164) + (y - 170) * (y - 170) < 40 * 40) {
                    id(ui_op) = 30;
                  }
                } else if (id(door_show)) {
                  // sonerie: 60 = deschide, 61 = ignora
                  if ((x - 78) * (x - 78) + (y - 192) * (y - 192) < 36 * 36) {
                    id(ui_op) = 60;
                  } else if ((x - 162) * (x - 162) + (y - 192) * (y - 192) < 36 * 36) {
                    id(ui_op) = 61;
                  }
                } else if (id(fade_active) && id(view) == 0) {
                  // orice atingere in timpul scaderii volumului anuleaza sleep-ul
                  id(ui_op) = 62;
                } else if (id(view) == 0) {
                  if (dx < -50 && abs(dy) < 60) {
                    if (ds >= 0) id(det_slot) = -1;
                    else id(page) = (id(page) + 1) % np2;
                  } else if (dx > 50 && abs(dy) < 60) {
                    if (ds >= 0) id(det_slot) = -1;
                    else id(page) = (id(page) + np2 - 1) % np2;
                  } else if (abs(dx) < 30 && abs(dy) < 30) {
                    if (ds < 0 && x < 28 && y > 80 && y < 140) {
                      id(page) = (id(page) + np2 - 1) % np2;
                    } else if (ds < 0 && x > 212 && y > 80 && y < 140) {
                      id(page) = (id(page) + 1) % np2;
                    } else if (ds >= 0 && y < 46) {
                      id(det_slot) = -1;
                    } else if (ds >= 0) {
                      if (kind == 3) {
                        // media: 3 = anterior, 4 = play/pauza, 5 = urmator, 7 = volum din bara, 20 = sleep timer
                        int my = y - 122;
                        if ((x - 120) * (x - 120) + my * my < 34 * 34) {
                          id(ui_op) = 4;
                        } else if ((x - 72) * (x - 72) + my * my < 28 * 28) {
                          id(ui_op) = 3;
                        } else if ((x - 168) * (x - 168) + my * my < 28 * 28) {
                          id(ui_op) = 5;
                        } else if ((x - 186) * (x - 186) + (y - 186) * (y - 186) < 24 * 24) {
                          id(ui_op) = 20;
                        } else if (y >= 172 && y <= 204 && x >= 64 && x <= 164) {
                          float f = (x - 70) / 90.0f;
                          if (f < 0.0f) f = 0.0f;
                          if (f > 1.0f) f = 1.0f;
                          id(ui_val) = f;
                          id(ui_op) = 7;
                        }
                      } else if (kind == 4) {
                        // senzor: doar afisare
                      } else if (kind == 0) {
                        int ix = x - 120, iy = y - 112;
                        if (ix * ix + iy * iy < 76 * 76) id(ui_op) = 0;
                      } else {
                        // lumina / clima: minus, pornit-oprit, plus (y = 188)
                        if ((x - 120) * (x - 120) + (y - 188) * (y - 188) < 28 * 28) id(ui_op) = 0;
                        else if ((x - 64) * (x - 64) + (y - 188) * (y - 188) < 28 * 28) id(ui_op) = 2;
                        else if ((x - 176) * (x - 176) + (y - 188) * (y - 188) < 28 * 28) id(ui_op) = 1;
                      }
                    } else if (favp) {
                      // pagina Favorite: 4 butoane rotunde, op 10..13
                      const int fx[4] = {74, 166, 74, 166};
                      const int fy[4] = {90, 90, 170, 170};
                      for (int i = 0; i < 4; i++) {
                        int ddx = x - fx[i];
                        int ddy = y - fy[i];
                        if (ddx * ddx + ddy * ddy < 42 * 42) {
                          id(fav_idx) = i;
                          id(ui_op) = 10 + i;
                          break;
                        }
                      }
                    } else if (alp) {
                      // pagina Alarma: 40 ora+, 41 ora-, 42 minut+, 43 minut-, 44 pornit/oprit
                      if ((x - 60) * (x - 60) + (y - 146) * (y - 146) < 19 * 19) {
                        id(ui_op) = 40;
                      } else if ((x - 60) * (x - 60) + (y - 184) * (y - 184) < 19 * 19) {
                        id(ui_op) = 41;
                      } else if ((x - 180) * (x - 180) + (y - 146) * (y - 146) < 19 * 19) {
                        id(ui_op) = 42;
                      } else if ((x - 180) * (x - 180) + (y - 184) * (y - 184) < 19 * 19) {
                        id(ui_op) = 43;
                      } else if ((x - 120) * (x - 120) + (y - 166) * (y - 166) < 30 * 30) {
                        id(ui_op) = 44;
                      }
                    } else if (cardp || morep) {
                      // carduri: atingi un card ca sa intri in detaliu; pe prima pagina bara de jos = volumul muzicii (op 7)
                      int cell = -1;
                      if (y >= 42 && y <= 102 && x >= 38 && x <= 118) cell = 0;
                      else if (y >= 42 && y <= 102 && x >= 122 && x <= 202) cell = 1;
                      else if (y >= 110 && y <= 170 && x >= 38 && x <= 118) cell = 2;
                      else if (y >= 110 && y <= 170 && x >= 122 && x <= 202) cell = 3;
                      if (cell >= 0) {
                        int sl = -1;
                        if (cardp) {
                          if (cell == 0) sl = m1;
                          else if (cell == 1) sl = m2;
                          else if (cell == 2) sl = m3;
                          else if (palm >= 0) id(page) = palm;
                        } else {
                          int j = (pg - pmore) * 4 + cell;
                          if (j < nr) sl = rest[j];
                        }
                        if (sl >= 0) id(det_slot) = sl;
                      } else if (cardp && y >= 174 && y <= 204 && x >= 56 && x <= 184 && m3 >= 0) {
                        float f = (x - 60) / 120.0f;
                        if (f < 0.0f) f = 0.0f;
                        if (f > 1.0f) f = 1.0f;
                        id(ui_val) = f;
                        id(cmd_slot) = m3;
                        id(ui_op) = 7;
                      }
                    } else if (diagp) {
                      // diagnostic: doar afisare
                    }
                  }
                }
                if (ds >= 0 && id(ui_op) >= 0 && id(ui_op) < 10) id(cmd_slot) = ds;
                ESP_LOGI("puck", "tap page=%d detail=%d kind=%d x=%d y=%d op=%d", id(page), ds, kind, x, y, id(ui_op));
                if (id(ui_op) >= 0) {
                  id(flash_op) = id(ui_op);
                  id(flash_ms) = millis();
                }
            - if:
                condition:
                  lambda: 'return id(ui_op) >= 0 && id(ui_op) < 10;'
                then:
                  - script.execute:
                      id: slot_cmd
                      op: !lambda 'return id(ui_op);'
                  - script.execute: redraw_late
            - if:
                condition:
                  lambda: 'return id(ui_op) >= 10 && id(ui_op) < 20;'
                then:
                  - script.execute: fav_play
                  - script.execute: redraw_late
            - if:
                condition:
                  lambda: 'return id(ui_op) == 20;'
                then:
                  - script.execute: sleep_cycle
            - if:
                condition:
                  lambda: 'return id(ui_op) == 30;'
                then:
                  - script.execute: alarm_dismiss
            - if:
                condition:
                  lambda: 'return id(ui_op) == 31;'
                then:
                  - script.execute: alarm_snooze
            - if:
                condition:
                  lambda: 'return id(ui_op) == 60;'
                then:
                  - homeassistant.event:
                      event: esphome.puck_door_open
                      data:
                        device: ${name}
                  - lambda: id(door_show) = false;
                  - script.stop: door_guard
            - if:
                condition:
                  lambda: 'return id(ui_op) == 61;'
                then:
                  - lambda: id(door_show) = false;
                  - script.stop: door_guard
            - if:
                condition:
                  lambda: 'return id(ui_op) == 62;'
                then:
                  - select.set:
                      id: sel_sleep
                      option: Oprit
            - if:
                condition:
                  lambda: 'return id(ui_op) >= 40 && id(ui_op) <= 44;'
                then:
                  - script.execute:
                      id: alarm_adjust
                      op: !lambda 'return id(ui_op);'
                  - script.execute: redraw_late
            - component.update: lcd
      - script.execute: activity

# ================= VARIABILE =================
globals:
  - {id: view, type: int, restore_value: false, initial_value: "0"}   # 0 = pagini, 2 = standby
  - {id: page, type: int, restore_value: false, initial_value: "0"}
  - {id: theme, type: int, restore_value: false, initial_value: "0"}
  - {id: tx0, type: int, restore_value: false, initial_value: "0"}
  - {id: ty0, type: int, restore_value: false, initial_value: "0"}
  - {id: tx, type: int, restore_value: false, initial_value: "0"}
  - {id: ty, type: int, restore_value: false, initial_value: "0"}
  - {id: touching, type: bool, restore_value: false, initial_value: "false"}
  - {id: ignore_rel, type: bool, restore_value: false, initial_value: "false"}
  - {id: ui_op, type: int, restore_value: false, initial_value: "-1"}
  - {id: ui_val, type: float, restore_value: false, initial_value: "0"}
  - {id: flash_op, type: int, restore_value: false, initial_value: "-1"}
  - {id: flash_ms, type: uint32_t, restore_value: false, initial_value: "0"}
  - {id: cmd_mode, type: int, restore_value: false, initial_value: "-1"}
  - {id: cmd_val, type: float, restore_value: false, initial_value: "0"}
  - {id: push_changed, type: bool, restore_value: false, initial_value: "false"}
  - {id: last_push_ms, type: uint32_t, restore_value: false, initial_value: "0"}
  - {id: api_up, type: bool, restore_value: false, initial_value: "false"}
  - {id: va_phase, type: int, restore_value: false, initial_value: "0"}   # 0 = liber, 1 = ascult, 2 = gandesc, 3 = raspund, 4 = eroare
  - {id: va_frame, type: int, restore_value: false, initial_value: "0"}
  - {id: fav_idx, type: int, restore_value: false, initial_value: "0"}
  - {id: fav_ty1, type: int, restore_value: false, initial_value: "0"}
  - {id: fav_ty2, type: int, restore_value: false, initial_value: "0"}
  - {id: fav_ty3, type: int, restore_value: false, initial_value: "0"}
  - {id: fav_ty4, type: int, restore_value: false, initial_value: "1"}
  - {id: sleep_left, type: int, restore_value: false, initial_value: "0"}   # secunde ramase la sleep timer (0 = oprit)
  - {id: sleep_pub, type: int, restore_value: false, initial_value: "0"}
  - {id: alarm_ringing, type: bool, restore_value: false, initial_value: "false"}
  - {id: alarm_beep, type: bool, restore_value: false, initial_value: "true"}
  - {id: alarm_snd_idx, type: int, restore_value: false, initial_value: "0"}
  - {id: sb_style, type: int, restore_value: false, initial_value: "0"}   # standby: 0 = analog, 1 = digital
  - {id: art_ok, type: bool, restore_value: false, initial_value: "false"}   # true cand poza de album e descarcata si poate fi afisata
  - {id: det_slot, type: int, restore_value: false, initial_value: "-1"}   # slotul deschis in ecranul de detaliu (-1 = niciunul)
  - {id: cmd_slot, type: int, restore_value: false, initial_value: "-1"}   # slotul tinta pentru comenzi date de pe pagina Carduri
  - {id: door_show, type: bool, restore_value: false, initial_value: "false"}   # fereastra soneriei afisata
  - {id: door_ok, type: bool, restore_value: false, initial_value: "false"}   # poza soneriei descarcata
  - {id: fade_active, type: bool, restore_value: false, initial_value: "false"}   # scade volumul inainte de oprirea muzicii
  - {id: fade_v0, type: float, restore_value: false, initial_value: "-1"}   # volumul de dinainte de fade
  - {id: fade_ms, type: uint32_t, restore_value: false, initial_value: "0"}
  - {id: alarm_ramp, type: bool, restore_value: false, initial_value: "false"}   # alarma graduala in desfasurare
  - {id: alarm_steps, type: int, restore_value: false, initial_value: "0"}
  - {id: alarm_lvl, type: int, restore_value: false, initial_value: "0"}   # nivelul de trezire 0..100
  - {id: alarm_vol, type: float, restore_value: false, initial_value: "-1"}
  - {id: alarm_snd, type: bool, restore_value: false, initial_value: "false"}   # sunetul alarmei a pornit
  - {id: alarm_prev_vol, type: float, restore_value: false, initial_value: "NAN"}
  - {id: act_bright, type: float, restore_value: false, initial_value: "1.0"}   # luminozitate activa curenta (zi / noapte)
  - {id: sb_bright, type: float, restore_value: false, initial_value: "0.15"}   # luminozitate standby curenta (zi / noapte)
  - {id: night_now, type: bool, restore_value: false, initial_value: "false"}
  - {id: diag_vis, type: bool, restore_value: false, initial_value: "false"}
  - id: cmd_entity
    type: std::string
    restore_value: false
    initial_value: 'std::string("")'
  - id: fav_media
    type: std::string
    restore_value: false
    initial_value: 'std::string("")'
  - id: fav_type
    type: std::string
    restore_value: false
    initial_value: 'std::string("radio")'

