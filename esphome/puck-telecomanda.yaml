substitutions:
  name: puck-telecomanda
  friendly_name: "Puck Telecomanda"
  # numele camerei, scris sus pe pagina cu carduri
  room_label: "Dormitor"
  wake_word: hey_jarvis
  # entitatea de vreme folosita pe ceasul din standby (temperatura de afara si pictograma)
  weather_entity: weather.forecast_acasa
  # adresa interna a Home Assistant (http, cu portul), pentru poza de album din pagina de muzica
  ha_url: "http://homeassistant.local:8123"
  # playerul a carui poza apare pe fundalul paginii de muzica
  art_entity: media_player.dormitorul_principal_2

# ================= PAGINI (o entitate pe pagina, pana la 8, plus pagina Favorite si pagina Alarma) =================
# Valorile din slot-uri sunt doar cele de start; dupa prima pornire le schimbi din Home Assistant.
# icon: Bec, Power, TV, Ventilator, Incuietoare, Termostat, Muzica, Acasa, Garaj, AC, Jaluzele, Incalzire
# kind: Pornit-Oprit, Lumina, Climate, Media, Senzor
# smin / smax: limitele cercului pentru tipul Senzor
packages:
  slot1: !include
    file: puck_slot.yaml
    vars: {n: 1, label: "Living", icon: Bec, kind: Lumina, ent: light.living, smin: 0, smax: 100}
  slot2: !include
    file: puck_slot.yaml
    vars: {n: 2, label: "TV", icon: TV, kind: Pornit-Oprit, ent: switch.priza_tv, smin: 0, smax: 100}
  slot3: !include
    file: puck_slot.yaml
    vars: {n: 3, label: "Ventilator", icon: Ventilator, kind: Pornit-Oprit, ent: fan.ventilator, smin: 0, smax: 100}
  slot4: !include
    file: puck_slot.yaml
    vars: {n: 4, label: "AC", icon: AC, kind: Climate, ent: climate.ac_living, smin: 0, smax: 100}
  slot5: !include
    file: puck_slot.yaml
    vars: {n: 5, label: "Dormitor", icon: Bec, kind: Lumina, ent: light.dormitor, smin: 0, smax: 100}
  slot6: !include
    file: puck_slot.yaml
    vars: {n: 6, label: "Garaj", icon: Garaj, kind: Pornit-Oprit, ent: cover.garaj, smin: 0, smax: 100}
  slot7: !include
    file: puck_slot.yaml
    vars: {n: 7, label: "Temperatura", icon: Termostat, kind: Senzor, ent: sensor.temperatura_living, smin: 10, smax: 35}
  slot8: !include
    file: puck_slot.yaml
    vars: {n: 8, label: "Muzica", icon: Muzica, kind: Media, ent: media_player.dormitorul_principal_2, smin: 0, smax: 100}

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.5.0
  on_boot:
    priority: -100
    then:
      - script.execute: activity
      - script.execute: bright_update
      - delay: 3s
      - script.execute: go_home

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

api:
  encryption:
    key: !secret interfon_electra__encryption_key
  on_client_connected:
    - delay: 3s
    - script.execute: sync_ha
  actions:
    - action: push_states
      variables:
        s_state: string[]
        s_bri: float[]
        s_tgt: float[]
        s_cur: float[]
        s_title: string[]
        s_vol: float[]
        s_pos: float[]
        s_dur: float[]
      then:
        - lambda: |-
            text_sensor::TextSensor *a_st[8] = {id(st_1), id(st_2), id(st_3), id(st_4), id(st_5), id(st_6), id(st_7), id(st_8)};
            text_sensor::TextSensor *a_ti[8] = {id(ti_1), id(ti_2), id(ti_3), id(ti_4), id(ti_5), id(ti_6), id(ti_7), id(ti_8)};
            sensor::Sensor *a_br[8] = {id(br_1), id(br_2), id(br_3), id(br_4), id(br_5), id(br_6), id(br_7), id(br_8)};
            sensor::Sensor *a_tg[8] = {id(tg_1), id(tg_2), id(tg_3), id(tg_4), id(tg_5), id(tg_6), id(tg_7), id(tg_8)};
            sensor::Sensor *a_cu[8] = {id(cu_1), id(cu_2), id(cu_3), id(cu_4), id(cu_5), id(cu_6), id(cu_7), id(cu_8)};
            sensor::Sensor *a_vo[8] = {id(vo_1), id(vo_2), id(vo_3), id(vo_4), id(vo_5), id(vo_6), id(vo_7), id(vo_8)};
            sensor::Sensor *a_po[8] = {id(po_1), id(po_2), id(po_3), id(po_4), id(po_5), id(po_6), id(po_7), id(po_8)};
            sensor::Sensor *a_du[8] = {id(du_1), id(du_2), id(du_3), id(du_4), id(du_5), id(du_6), id(du_7), id(du_8)};
            auto differs = [](float a, float b) -> bool {
              if (std::isnan(a) && std::isnan(b)) return false;
              if (std::isnan(a) || std::isnan(b)) return true;
              return fabsf(a - b) > 0.01f;
            };
            ESP_LOGD("puck", "push_states: n=%d s1=%s s2=%s s3=%s s4=%s", (int) s_state.size(),
                     s_state.size() > 0 ? s_state[0].c_str() : "-",
                     s_state.size() > 1 ? s_state[1].c_str() : "-",
                     s_state.size() > 2 ? s_state[2].c_str() : "-",
                     s_state.size() > 3 ? s_state[3].c_str() : "-");
            bool changed = false;
            for (int i = 0; i < 8; i++) {
              if (i < (int) s_state.size() && a_st[i]->state != s_state[i]) {
                a_st[i]->publish_state(s_state[i]);
                changed = true;
              }
              if (i < (int) s_title.size() && a_ti[i]->state != s_title[i]) {
                a_ti[i]->publish_state(s_title[i]);
                changed = true;
              }
              if (i < (int) s_bri.size()) {
                float v = s_bri[i] < 0 ? NAN : s_bri[i];
                if (differs(a_br[i]->state, v)) { a_br[i]->publish_state(v); changed = true; }
              }
              if (i < (int) s_tgt.size()) {
                float v = s_tgt[i] < 0 ? NAN : s_tgt[i];
                if (differs(a_tg[i]->state, v)) { a_tg[i]->publish_state(v); changed = true; }
              }
              if (i < (int) s_cur.size()) {
                float v = s_cur[i] < 0 ? NAN : s_cur[i];
                if (differs(a_cu[i]->state, v)) { a_cu[i]->publish_state(v); changed = true; }
              }
              if (i < (int) s_vol.size()) {
                float v = s_vol[i] < 0 ? NAN : s_vol[i];
                if (differs(a_vo[i]->state, v)) { a_vo[i]->publish_state(v); changed = true; }
              }
              if (i < (int) s_pos.size()) {
                float v = s_pos[i] < 0 ? NAN : s_pos[i];
                if (differs(a_po[i]->state, v)) { a_po[i]->publish_state(v); changed = true; }
              }
              if (i < (int) s_dur.size()) {
                float v = s_dur[i] < 0 ? NAN : s_dur[i];
                if (differs(a_du[i]->state, v)) { a_du[i]->publish_state(v); changed = true; }
              }
            }
            id(last_push_ms) = millis();
            id(push_changed) = changed;
        - if:
            condition:
              lambda: 'return id(push_changed);'
            then:
              - script.execute: redraw
    # sonerie: Home Assistant trimite adresa pozei de la camera; Puck afiseaza fereastra cu Deschide / Ignora
    - action: doorbell
      variables:
        image_url: string
      then:
        - lambda: |-
            id(door_ok) = false;
            id(door_show) = true;
            id(view) = 0;
        - light.turn_on:
            id: backlight
            brightness: !lambda 'return id(act_bright);'
        - script.execute: door_guard
        - script.execute: activity
        - online_image.set_url:
            id: door_img
            url: !lambda |-
              std::string u = std::string(image_url.c_str());
              if (u.rfind("http", 0) == 0) return u;
              return std::string("${ha_url}") + u;
        - component.update: door_img
        - component.update: lcd
        # sunet de sonerie pe difuzorul Puck-ului (de doua ori), daca nu suna alarma
        - repeat:
            count: 2
            then:
              - if:
                  condition:
                    lambda: 'return id(door_snd)->state && !id(alarm_ringing) && id(door_show);'
                  then:
                    - media_player.speaker.play_on_device_media_file:
                        media_file: timer_finished_sound
                        announcement: true
                    - delay: 3s

ota:
  - platform: esphome

# ================= POZA DE ALBUM / LOGO RADIO PE FUNDALUL PAGINII DE MUZICA =================
http_request:
  timeout: 20s
  buffer_size_rx: 4096

image:
  - platform: online_image
    id: art_img
    # adresa reala se seteaza din text_sensor-ul art_path, cand se schimba piesa; aceasta e doar o valoare de pornire
    url: "${ha_url}/local/none.png"
    format: AUTO
    type: RGB565
    resize: 240x240
    update_interval: never
    on_download_finished:
      - lambda: id(art_ok) = true;
      - component.update: lcd
    on_error:
      - lambda: id(art_ok) = false;
      - component.update: lcd

  # poza de la camera soneriei (se descarca de fiecare data cand suna)
  - platform: online_image
    id: door_img
    url: "${ha_url}/local/none.png"
    format: AUTO
    type: RGB565
    resize: 240x240
    update_interval: never
    on_download_finished:
      - lambda: id(door_ok) = true;
      - component.update: lcd
    on_error:
      - lambda: id(door_ok) = false;
      - component.update: lcd

# ================= ORA (de la Home Assistant, cu rezerva de la internet) =================
time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - script.execute: redraw
    on_time:
      - seconds: 0
        then:
          - if:
              condition:
                lambda: 'return id(view) == 2;'
              then:
                - component.update: lcd
          - script.execute: alarm_check
  # rezerva: daca Home Assistant nu e disponibil, ceasul si alarma merg de la internet
  - platform: sntp
    id: sntp_time
    timezone: Europe/Bucharest
    servers:
      - ro.pool.ntp.org
      - pool.ntp.org
      - time.google.com
    on_time:
      - seconds: 0
        then:
          - script.execute: alarm_check

