  # ---- sleep timer pentru muzica: nu se restaureaza dupa repornire, ca sa nu porneasca singur ----
  - platform: template
    name: "Sleep timer"
    id: sel_sleep
    optimistic: true
    restore_value: false
    initial_option: Oprit
    options: [Oprit, 15 min, 30 min, 45 min, 60 min, 90 min]
    on_value:
      - lambda: |-
          static const int MIN[6] = {0, 15, 30, 45, 60, 90};
          int m = (i >= 0 && i < 6) ? MIN[i] : 0;
          id(sleep_left) = m * 60;
          id(sleep_pub) = m;
          id(sleep_rem)->publish_state(m);
      # daca se anuleaza in timpul scaderii volumului, il pune la loc
      - if:
          condition:
            lambda: 'return i == 0 && id(fade_active);'
          then:
            - script.stop: sleep_fade
            - lambda: id(fade_active) = false;
            - homeassistant.action:
                action: media_player.volume_set
                data:
                  entity_id: !lambda 'return id(fav_player)->state;'
                  volume_level: !lambda 'return str_sprintf("%.2f", id(fade_v0));'
